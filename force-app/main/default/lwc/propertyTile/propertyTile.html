<template>
    <div class="tile" onclick={handleClick}>
        <img src={property.Thumbnail_IMG__c} alt={property.Name} />
        <div class="lower-third">
            <h1 class="slds-truncate">{property.Name}</h1>
            <template if:true={hasPrice}>
                <lightning-formatted-number
                    value={property.Price__c}
                    format-style="currency"
                    currency-code="USD"
                    maximum-fraction-digits="0"
                ></lightning-formatted-number>
            </template>
            <template if:false={hasPrice}>
                <p data-id="price-on-request">Price on request</p>
            </template>
        </div>
    </div>
</template>
